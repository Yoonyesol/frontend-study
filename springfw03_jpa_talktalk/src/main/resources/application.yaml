spring:
  application:
    name:
      talktalk

  datasource:
    url: jdbc:oracle:thin:@yoonyesol-database-1.che2qaq0yn1s.ap-northeast-2.rds.amazonaws.com:1521/Orcl  # 서비스명 방식은 슬래시(/)
    username: admin
    password: qwer1234
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none            # 테이블은 schema-oracle.sql로 직접 생성 (JPA가 DDL 건드리지 않음)
    open-in-view: false         # 영속성 컨텍스트를 Service 트랜잭션 안에서만 사용
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100   # 지연 로딩 시 IN 쿼리로 묶어서 조회 (N+1 완화)

logging:
  level:
    org.hibernate.SQL: debug                 # 실행되는 SQL 출력
    org.hibernate.orm.jdbc.bind: trace       # ? 에 바인딩되는 값 출력
