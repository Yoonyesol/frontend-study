<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>할 일 목록</title>
</head>
<body>
<h1>할 일 목록</h1>

<p th:if="${message}" th:text="${message}" style="color:green"></p>

<a th:href="@{/todos/new}">+ 새 할 일</a>

<table border="1">
    <tr><th>ID</th><th>제목</th><th>상태</th><th></th></tr>

    <tr th:each="todo : ${todos}"> <!-- todos 리스트에 요소가 하나씩 todo 변수로 저장되면서 리스트의 요소 수 만큼 반복 -->
        <td th:text="${todo.id}">1</td>
        <td><a th:href="@{/todos/{id}(id=${todo.id})}" th:text="${todo.title}">제목</a></td>
        <td th:text="${todo.done} ? '완료' : '진행중'">상태</td>
        <td>
            <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post">
                <button type="submit">상태 변경</button>
            </form>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(todos)}">
        <td colspan="4">할 일이 없습니다.</td>
    </tr>
</table>
</body>
</html>
