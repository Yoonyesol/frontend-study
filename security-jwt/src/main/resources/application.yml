spring:
  application:
    name: springSecurity

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XE   # 서비스명은 슬래시(/), SID는 콜론(:) — 본인 DB에 맞게 확인
    username: SYSTEM
    password: ${DB_PASSWORD:qwer123}                 # 환경변수가 없으면 TIGER 사용 (실습용)
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: none            # 테이블은 schema-oracle.sql로 직접 생성 (JPA가 DDL을 건드리지 않음)
    open-in-view: false         # 영속성 컨텍스트를 Service 트랜잭션 안에서만 사용
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

# JWT 설정 (최상위 키는 0칸에서 시작)
jwt:
  secret: ${JWT_SECRET:this-is-a-local-dev-secret-key-32bytes!!}   # 32바이트 이상 필수, 운영에서는 환경변수로 주입
  access-expiration-ms: 1800000                                    # 30분 (만료 실습 시 10000 = 10초)

logging:
  level:
    org.springframework.security: DEBUG      # 필터 동작을 자세히 보려면 TRACE
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
