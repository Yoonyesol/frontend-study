<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문</title>
    <style>
        body {
            font-family: '맑은 고딕', 'Malgun Gothic', '돋움', Dotum, sans-serif;
            margin: 20px;
        }

        #title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .food-item {
            margin-bottom: 8px;
        }

        .food-item label {
            display: inline-block;
            width: 100px;
            cursor: pointer;
        }

        .food-item input[type="radio"] {
            cursor: pointer;
        }

        #submitBtn {
            margin-top: 10px;
            padding: 2px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="title">주문</div>

    <form id="orderForm">
        <div class="food-item">
            <label for="jajang">짜장면(500)</label>
            <input type="radio" id="jajang" name="food" value="500" checked>
        </div>
        <div class="food-item">
            <label for="jjamppong">짬뽕(700)</label>
            <input type="radio" id="jjamppong" name="food" value="700">
        </div>
        <div class="food-item">
            <label for="reset">초기화</label>
            <input type="radio" id="reset" name="food" value="reset">
        </div>
        <button type="button" id="submitBtn">Submit</button>
    </form>

    <script>
        let total = 0;

        const title = document.getElementById("title");
        const submitBtn = document.getElementById("submitBtn");

        submitBtn.addEventListener("click", function () {
            const selected = document.querySelector('input[name="food"]:checked');

            if (!selected) {
                alert("음식 또는 초기화를 선택해주세요.");
                return;
            }

            if (selected.value === "reset") {
                total = 0;
            } else {
                total += parseInt(selected.value, 10);
            }

            title.textContent = "총 매출 : " + total + "원";

            const radios = document.querySelectorAll('input[name="food"]');
            for (let i = 0; i < radios.length; i++) {
                radios[i].checked = false;
            }
        });
    </script>
</body>
</html>
