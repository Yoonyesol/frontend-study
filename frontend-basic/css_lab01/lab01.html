<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        font-size: 0.75em;
        color: #333;
      }

      #login-form {
        width: 180px;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #666;
        margin: 0 10px;
        height: 120px;
      }

      #login-form label {
        display: block;
        margin-top: 5px;
        margin-bottom: 3px;
      }

      #login-form input[type="text"] {
        display: block;
        margin-top: 5px;
        margin-bottom: 3px;
      }

      #login-form br {
        display: none;
      }
    </style>
  </head>
  <body>
    <form id="login-form">
      아이디 <input type="text" /><br />
      패스워드 <input type="text" /><br />
      <input type="submit" value="로그인" />
    </form>
  </body>
</html>
